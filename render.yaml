# Render blueprint for the API. The database lives on Neon. Set DATABASE_URL and FRONTEND_URL in the Render dashboard.
services:
  - type: web
    name: stokvel-credit-passport-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Checks production settings, applies migrations, loads synthetic demo data once, then starts the API.
    startCommand: sh start.sh
    healthCheckPath: /api/health
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.7 }
      - { key: ENVIRONMENT, value: production }
      - { key: COOKIE_SECURE, value: "true" }
      - { key: PAYMENT_PROVIDER, value: test }
      - { key: PAYMENT_TEST_MODE, value: "true" }
      - { key: RATE_LIMIT_ENABLED, value: "true" }
      # Proxies in front of the API that append to X-Forwarded-For. Confirm after the first deploy: see docs/DEPLOYMENT.md.
      - { key: TRUSTED_PROXY_HOPS, value: "1" }
      # Public demo with synthetic data only. Remove before any real data is stored.
      - { key: ALLOW_DEMO_SEED, value: "true" }
      - { key: SECRET_KEY, generateValue: true }
      - { key: DATABASE_URL, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: CORS_ORIGINS, sync: false }
