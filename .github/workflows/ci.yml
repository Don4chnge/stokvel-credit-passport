name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: scp_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/scp_test" }
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/scp_test" }

  security:
    name: Security checks (secrets, dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan the full git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Python dependency advisories
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: JavaScript dependency advisories
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  frontend:
    name: Frontend types, unit tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end journeys (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run e2e
        env: { E2E_PYTHON: python, CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
